    <p class="eyebrow">How it works · Advantech AFE-R750 · Jetson AGX Orin 32GB</p>
    <h1>From a camera frame to a live answer — on one device</h1>
    <p class="subtitle">Every 30th frame goes to Qwen3-VL-4B on the Ampere GPU with the chosen prompt; the answer streams onto the screen live.</p>

<title id="live-vlm-how-it-works-title">How the Live VLM main demo works on the AGX Orin</title>
<desc id="live-vlm-how-it-works-desc">A camera feed or video file is read on the board; every 30th frame is sent as a JPEG to Qwen3-VL-4B on the Ampere GPU (Ollama, llama.cpp with CUDA) together with the chosen prompt preset, an answer-length limit and a 512-token cap; the answer streams onto the screen word by word, with TTFT, speed and system stats.</desc>
